<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>OpenCode Native Chat — README banner illustration</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #10151e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #banner { width: 1200px; height: 460px; padding: 54px 64px; position: relative; overflow: hidden; color: #f5f7fb; background: radial-gradient(ellipse at 100% 0, #153d43 0, transparent 60%), #10151e; }
  .eyebrow { margin: 0 0 24px; color: #8de6cf; font-size: 16px; font-weight: 650; letter-spacing: 3px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 64px; line-height: 1.1; letter-spacing: -2.5px; font-weight: 700; }
  .subtitle { margin: 24px 0 0; font-size: 26px; line-height: 1.5; color: #bcc8d6; }
  .features { display: flex; gap: 12px; margin-top: 36px; }
  .features span { border: 1px solid #344551; border-radius: 8px; padding: 11px 17px; color: #d7e7ed; font-size: 17px; background: #17252e; }
  .mark { position: absolute; right: 64px; top: 122px; width: 206px; height: 176px; border: 2px solid #4f8b86; border-radius: 26px; background: #172e35; display: flex; align-items: center; justify-content: center; font-family: monospace; color: #8de6cf; font-size: 70px; font-weight: 600; }
  .mark::after { content: ""; position: absolute; bottom: -20px; right: 37px; width: 36px; height: 36px; background: #172e35; border-right: 2px solid #4f8b86; border-bottom: 2px solid #4f8b86; transform: skewY(35deg); }
</style>
<main id="banner" aria-label="OpenCode Native Chat. Your models, agents, and tools in VS Code's native Chat.">
  <p class="eyebrow">OpenCode × VS Code</p>
  <h1>Your agent.<br>Your editor.</h1>
  <p class="subtitle">OpenCode in native Chat.<br>Your setup comes with you.</p>
  <div class="features"><span>Models &amp; agents</span><span>File context</span><span>Tool permissions</span></div>
  <div class="mark" aria-hidden="true">&gt;_</div>
</main>
</html>
